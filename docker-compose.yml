services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: quill-postgres
    environment:
      POSTGRES_USER: quill
      POSTGRES_PASSWORD: quill
      POSTGRES_DB: quill
    ports:
      - "5432:5432"
    volumes:
      - quill-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quill -d quill"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: quill-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  quill-pgdata:
