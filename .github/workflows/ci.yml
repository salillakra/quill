name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "postgresql://quill:quill@localhost:5432/quill?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-secret-do-not-use-in-prod-0123456789abcdef"
      PINECONE_API_KEY: "ci-placeholder"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Install
        run: bun install
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test

  frontend:
    name: Frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
